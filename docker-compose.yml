version: "3.8"

services:
  postgres:
    image: postgres:17
    container_name: postgres-dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: english_platform_db
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: